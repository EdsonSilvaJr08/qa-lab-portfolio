name: Portfólio | Gravar demonstração Playwright
on:
  push:
    branches: [main]
    paths:
      - 'automacao.html'
      - 'scripts/record-demo.mjs'
      - '.github/workflows/demo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Gravar fluxo demonstrativo real
        run: node scripts/record-demo.mjs
      - name: Guardar gravação como evidência
        uses: actions/upload-artifact@v4
        with:
          name: demonstracao-playwright
          path: |
            assets/demo/automacao.webm
            assets/demo/painel.png
          retention-days: 7
      - name: Publicar vídeo e screenshot no site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/demo/automacao.webm assets/demo/painel.png
          if git diff --staged --quiet; then
            echo 'Nenhuma alteração nas evidências.'
            exit 0
          fi
          git commit -m 'docs: publicar gravação real da automação Playwright'
          git push origin HEAD:main
